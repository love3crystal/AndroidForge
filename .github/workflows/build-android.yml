name: Build Android APK

# AndroidForge — Universal Android APK Builder
#
# This workflow uses the PREBUILT Docker image published to GHCR by
# .github/workflows/build-android-image.yml, so it does NOT reinstall
# the JDK / Android SDK / Gradle / Flutter on every run. The image is:
#   ghcr.io/<owner>/androidforge-build-env:latest
#
# Workflow:
#   1. Acquire source ZIP (input/ dir, public URL, or GitHub Release asset)
#   2. Extract ZIP to a clean workspace
#   3. Detect project type (Gradle / Flutter / multi-module / etc.)
#   4. Configure toolchain (JDK / Gradle / NDK / Flutter) based on detection
#   5. Switch JAVA_HOME to the detected JDK version (all JDKs are in the image)
#   6. Install ONLY missing project-specific Android SDK components
#   7. Install NDK only if the project uses native code
#   8. Build the project (assembleDebug / assembleRelease / bundleDebug)
#   9. Collect generated APKs and pick the primary one
#  10. Upload APK as a GitHub Actions artifact + publish to release
#  11. On failure, run automated diagnosis

on:
  push:
    paths:
      - ".github/workflows/build-android.yml"
  workflow_dispatch:
    inputs:
      zip_source:
        description: "Where should the workflow get the source ZIP from?"
        type: choice
        required: true
        default: "input-directory"
        options:
          - "input-directory"
          - "download-url"
          - "release-asset"
      zip_path:
        description: "Exact path (relative to repo root) of the source ZIP in input/. Required when zip_source=input-directory and multiple ZIPs are present — otherwise the build picks the wrong one."
        required: false
        type: string
        default: ""
      zip_url:
        description: "Direct download URL (only used if 'download-url' is selected)"
        required: false
        type: string
        default: ""
      release_tag:
        description: "GitHub Release tag containing the ZIP (only used if 'release-asset' is selected)"
        required: false
        type: string
        default: ""
      build_variant:
        description: "Build variant to produce"
        type: choice
        required: true
        default: "auto"
        options:
          - "auto"
          - "debug"
          - "release"
          - "bundle"
      enable_ndk:
        description: "Install NDK even if no native code is detected (force-true)"
        type: boolean
        required: false
        default: false
  # NOTE: We intentionally do NOT have a `push.paths: input/**.zip`
  # trigger. The Pages UI commits the ZIP to input/ AND triggers
  # workflow_dispatch — if both triggers were active, every UI build
  # would fire TWO workflow runs (one from the push, one from the
  # dispatch). Removing the push trigger means only workflow_dispatch
  # fires, so users get exactly one build per click.
  # If you want to build via git push, trigger the workflow manually
  # from the Actions tab after pushing.

# Never expose secrets to the (untrusted) uploaded source ZIP.
# contents:write is required so the GITHUB_TOKEN can upload the built APK
# back to the source release as an asset — that's what lets the Pages UI
# offer a direct download link (no CORS issues, no auth header dance).
# packages:read lets the workflow pull the prebuilt Docker image from GHCR.
permissions:
  contents: write
  actions: write
  packages: read

concurrency:
  group: androidforge-build-${{ github.ref }}-${{ github.event.inputs.zip_source || 'auto' }}
  cancel-in-progress: false

env:
  # These point to paths baked into the Docker image.
  ANDROID_HOME: /opt/android-sdk
  ANDROID_SDK_ROOT: /opt/android-sdk
  JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=false"
  PYTHONUNBUFFERED: "1"

# Use the prebuilt image so we don't reinstall JDK + Android SDK + Gradle +
# Flutter on every single build. The image is built by
# .github/workflows/build-android-image.yml and lives at:
#   ghcr.io/<owner>/androidforge-build-env:latest
# If the image is missing (first-ever run before the image build has run),
# this workflow will fail with a clear "image not found" error — the fix is
# to run the "Build & Publish Android Image" workflow once.
jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    # The image is published by build-android-image.yml to GHCR.
    # GHCR normalizes the image name to lowercase, so we use the lowercase
    # owner here. If you fork the repo, update this to your-lowercase-username
    # OR override the env var IMAGE_REF below.
    container: ghcr.io/love3crystal/androidforge-build-env:latest
    timeout-minutes: 60
    outputs:
      project_type: ${{ steps.detect.outputs.project_type }}
      build_succeeded: ${{ steps.build.outputs.build_succeeded }}
      apk_count: ${{ steps.collect.outputs.apk_count }}
      primary_apk_name: ${{ steps.collect.outputs.primary_apk_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Python is already installed in the Docker image — but we still need
      # to install the project's specific Python deps (PyYAML).
      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip --quiet
          python3 -m pip install -r scripts/requirements.txt --quiet

      # ---------------------------------------------------------------------
      # Step 1: Acquire ZIP
      # ---------------------------------------------------------------------
      - name: Acquire source ZIP
        id: acquire
        run: |
          python3 scripts/acquire_zip.py \
            --source "${{ inputs.zip_source || 'input-directory' }}" \
            --url "${{ inputs.zip_url }}" \
            --tag "${{ inputs.release_tag }}" \
            --path "input/ycqjsq.zip"

      # ---------------------------------------------------------------------
      # Step 2: Extract ZIP
      # ---------------------------------------------------------------------
      - name: Extract source ZIP
        id: extract
        run: python3 scripts/extract_zip.py --zip "${{ steps.acquire.outputs.zip_path }}"

      - name: Apply GLR branding to calculator project
        if: steps.extract.outputs.project_root != ''
        shell: bash
        run: |
          ROOT="${{ steps.extract.outputs.project_root }}"
          python3 - "$ROOT" <<'PY'
          from pathlib import Path
          import os, sys
          root = Path(sys.argv[1])
          app = root / "app"

          # Patch every matching source file. This project may keep the real UI in a feature module,
          # not under app/src/main; patching only the app copy can produce an APK with unchanged UI.
          import textwrap, re
          keypad_candidates = [p for p in root.rglob("CalculatorKeypad.kt") if "/src/main/" in p.as_posix()]
          state_candidates = [p for p in root.rglob("BasicCalculatorUiState.kt") if "/src/main/" in p.as_posix()]
          vm_candidates = [p for p in root.rglob("BasicCalculatorViewModel.kt") if "/src/main/" in p.as_posix()]
          if not keypad_candidates:
              raise SystemExit("No main-source CalculatorKeypad.kt found; refusing to build.")
          if not state_candidates or not vm_candidates:
              raise SystemExit("Calculator UI state/view-model source not found; refusing to build.")
          print("CalculatorKeypad candidates:", [p.as_posix() for p in keypad_candidates])
          print("UI state candidates:", [p.as_posix() for p in state_candidates])
          print("View-model candidates:", [p.as_posix() for p in vm_candidates])

          def patch_keypad_file(keypad):
              k = keypad.read_text(encoding="utf-8")
              k = k.replace(
                  'KeypadRowSpec(listOf(Key.Clear, Key.SignFlip, Key.Symbol("%"), Key.Symbol("÷")), compact = true),',
                  'KeypadRowSpec(listOf(Key.Clear, Key.Backspace, Key.SignFlip, Key.Symbol("%"), Key.Symbol("÷")), compact = true),'
              )
              new_bottom = "\n".join("            " + line for line in textwrap.dedent("""
                  // Five equal-width keys: history trash, double-zero, zero, decimal, equals.
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.spacedBy(8.dp),
                  ) {
                      KeyButton(
                          key = Key.Function("clearall", "🗑"),
                          onEvent = onEvent,
                          compact = true,
                          modifier = Modifier.weight(1f).keySize(BUTTON_ASPECT_RATIO_COMPACT, minKeyHeight),
                      )
                      KeyButton(
                          key = Key.Symbol("00"),
                          onEvent = onEvent,
                          compact = true,
                          modifier = Modifier.weight(1f).keySize(BUTTON_ASPECT_RATIO_COMPACT, minKeyHeight),
                      )
                      KeyButton(
                          key = Key.Symbol("0"),
                          onEvent = onEvent,
                          compact = true,
                          modifier = Modifier.weight(1f).keySize(BUTTON_ASPECT_RATIO_COMPACT, minKeyHeight),
                      )
                      KeyButton(
                          key = Key.Symbol("."),
                          onEvent = onEvent,
                          compact = true,
                          modifier = Modifier.weight(1f).keySize(BUTTON_ASPECT_RATIO_COMPACT, minKeyHeight),
                      )
                      KeyButton(
                          key = Key.Equals,
                          onEvent = onEvent,
                          compact = true,
                          modifier = Modifier.weight(1f).keySize(BUTTON_ASPECT_RATIO_COMPACT, minKeyHeight),
                      )
                  }
              """).strip("\n").splitlines())
              # Replace the existing bottom Row by locating its balanced braces.
              # This avoids brittle indentation-sensitive regex matching.
              marker = "// Bottom iOS-style row:"
              start = k.find(marker)
              if start >= 0:
                  row_start = k.find("Row(", start)
                  body_start = k.find("{", row_start)
                  if row_start < 0 or body_start < 0:
                      raise SystemExit(f"{keypad}: could not locate bottom Row body.")
                  depth = 0
                  end = -1
                  for pos in range(body_start, len(k)):
                      if k[pos] == "{":
                          depth += 1
                      elif k[pos] == "}":
                          depth -= 1
                          if depth == 0:
                              end = pos + 1
                              break
                  if end < 0:
                      raise SystemExit(f"{keypad}: bottom Row braces are unbalanced.")
                  line_start = k.rfind("\n", 0, start) + 1
                  line_end = k.find("\n", end)
                  if line_end < 0:
                      line_end = len(k)
                  k = k[:line_start] + new_bottom + k[line_end:]
              elif "Five equal-width keys: history trash, double-zero, zero, decimal, equals." not in k:
                  raise SystemExit(f"{keypad}: bottom row marker missing; refusing to build.")
              old_symbol = 'is Key.Symbol -> onEvent(BasicCalculatorEvent.Append(key.label))'
              new_symbol = 'is Key.Symbol -> if (key.label == "00") { onEvent(BasicCalculatorEvent.Append("0")); onEvent(BasicCalculatorEvent.Append("0")) } else onEvent(BasicCalculatorEvent.Append(key.label))'
              if old_symbol in k:
                  k = k.replace(old_symbol, new_symbol, 1)
              elif new_symbol not in k:
                  raise SystemExit(f"{keypad}: symbol dispatch pattern not found; refusing to build.")
              old_function = 'is Key.Function -> onEvent(BasicCalculatorEvent.Append("${key.keyword}("))'
              new_function = 'is Key.Function -> if (key.keyword == "clearall") onEvent(BasicCalculatorEvent.ClearTape) else onEvent(BasicCalculatorEvent.Append("${key.keyword}("))'
              if old_function in k:
                  k = k.replace(old_function, new_function, 1)
              elif new_function not in k:
                  raise SystemExit(f"{keypad}: function dispatch pattern not found; refusing to build.")
              keypad.write_text(k, encoding="utf-8")
              # Strong source-level assertions: exactly five weighted bottom-row keys and a single-width zero.
              bottom = k.split("Five equal-width keys: history trash, double-zero, zero, decimal, equals.", 1)[-1]
              bottom = bottom.split("// Bottom iOS-style row:", 1)[0]
              if bottom.count("KeyButton(") < 5 or 'key = Key.Symbol("0")' not in bottom:
                  raise SystemExit(f"{keypad}: bottom row assertions failed.")
              zero_part = bottom.split('key = Key.Symbol("0")', 1)[1].split("KeyButton(", 1)[0]
              if "Modifier.weight(1f)" not in zero_part:
                  raise SystemExit(f"{keypad}: zero key is not constrained to one equal-width column.")
              print("PATCHED keypad:", keypad)

          for keypad_file in keypad_candidates:
              patch_keypad_file(keypad_file)
          keypad = keypad_candidates[0]

          for ui_state in state_candidates:
              u = ui_state.read_text(encoding="utf-8")
              if "data object ClearTape" not in u:
                  u = u.replace(
                      '    data object ClearAll : BasicCalculatorEvent\n',
                      '    data object ClearAll : BasicCalculatorEvent\n\n    /** Clear only the visible calculation tape, preserving the current expression. */\n    data object ClearTape : BasicCalculatorEvent\n'
                  )
              ui_state.write_text(u, encoding="utf-8")
          ui_state = state_candidates[0]

          for vm in vm_candidates:
              v = vm.read_text(encoding="utf-8")
              if "BasicCalculatorEvent.ClearTape -> tapeStore.clear()" not in v:
                  v = v.replace(
                      '                BasicCalculatorEvent.Clear -> clear()\n',
                      '                BasicCalculatorEvent.Clear -> clear()\n                BasicCalculatorEvent.ClearTape -> tapeStore.clear()\n'
                  )
              vm.write_text(v, encoding="utf-8")
          vm = vm_candidates[0]

          # Correct the user-visible app title in all localized resource files.
          for strings in (app / "src").glob("*/res/values*/strings.xml"):
              s = strings.read_text(encoding="utf-8")
              import re
              s = re.sub(r'(<string name="app_name"[^>]*>).*?(</string>)', r'\1格拉瑞计算器\2', s)
              s = re.sub(r'(<string name="app_name_short"[^>]*>).*?(</string>)', r'\1格拉瑞计算器\2', s)
              strings.write_text(s, encoding="utf-8")
          settings = app / "src/main/java/com/calculator/feature/settings/SettingsSheet.kt"
          import re
          if settings.exists():
              s = settings.read_text(encoding="utf-8")
              s = re.sub(r'value = "\\$\\{BuildConfig\\.VERSION_NAME\\} \\(\\$\\{BuildConfig\\.VERSION_CODE\\}\\)",', r'value = "GLR ${BuildConfig.VERSION_NAME} (${BuildConfig.VERSION_CODE})",', s)
              s = re.sub(r'value = stringResource\(R.string.settings_about_license_value\),', 'value = "GLR · Apache 2.0",', s)
              s = re.sub(r'onClick = \{ uriHandler.openUri\("https://github.com/[^"]+"\) \},', 'onClick = { uriHandler.openUri("https://github.com/love3crystal/AndroidForge") },', s)
              settings.write_text(s, encoding="utf-8")
          strings = app / "src/main/res/values/strings.xml"
          if strings.exists():
              s = strings.read_text(encoding="utf-8")
              s = re.sub(r'(<string name="settings_about_github_value"[^>]*>).*?(</string>)', r'\1love3crystal/AndroidForge\2', s)
              s = re.sub(r'(<string name="settings_about_license_value"[^>]*>).*?(</string>)', r'\1GLR · Apache 2.0\2', s)
              strings.write_text(s, encoding="utf-8")
          gradle = app / "build.gradle.kts"
          if gradle.exists():
              s = gradle.read_text(encoding="utf-8")
              if "isMinifyEnabled = true" not in s:
                  s = s.replace("release {", "release {" + chr(10) + "            isMinifyEnabled = true" + chr(10) + "            isShrinkResources = true", 1)
              # Give every build a monotonically increasing versionCode.
              build_code = 10000 + int(os.environ.get("GITHUB_RUN_NUMBER", "1"))
              s, code_count = re.subn(r'(?m)^(\s*versionCode\s*=\s*)\d+\b', lambda m: m.group(1) + str(build_code), s)
              if code_count != 1:
                  raise SystemExit(f"Expected exactly one literal versionCode in app/build.gradle.kts, found {code_count}; refusing to publish.")
              gradle.write_text(s, encoding="utf-8")
          bg = app / "src/main/res/drawable/ic_launcher_background.xml"
          if bg.exists():
              bg.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#1769E0" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#1254B8" android:pathData="M0,78L108,18v90h-108z"/>
          </vector>
          ''', encoding="utf-8")
          fg = app / "src/main/res/drawable/ic_launcher_foreground.xml"
          if fg.exists():
              fg.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <!-- Bold, separated GLR block letters with safe margins for adaptive-icon masking. -->
              <path android:fillColor="#FFFFFFFF" android:pathData="M18,30h7v40h-7z M18,30h20v7H18z M18,63h20v7H18z M31,48h7v22h-7z M27,48h11v7H27z"/>
              <path android:fillColor="#FFFFFFFF" android:pathData="M42,30h7v33h11v7H42z"/>
              <path android:fillColor="#FFFFFFFF" android:pathData="M64,30h7v40h-7z M64,30h26v7H64z M83,30h7v23h-7z M64,46h26v7H64z M70,50h8l11,20h-8z"/>
              <path android:fillColor="#1769E0" android:pathData="M72,37h11v9H72z"/>
          </vector>
          ''', encoding="utf-8")
          print("GLR branding applied to", root)
          print("GLR post-patch verification enabled in workflow")
          # Stop the release if the requested changes were not actually applied.
          checks = {
              "backspace": "Key.Backspace" in keypad.read_text(encoding="utf-8"),
              "bottom row replaced": "Five equal-width keys: history trash, double-zero, zero, decimal, equals." in keypad.read_text(encoding="utf-8"),
              "five bottom-row buttons": ("Five equal-width keys: history trash, double-zero, zero, decimal, equals." in keypad.read_text(encoding="utf-8")) and keypad.read_text(encoding="utf-8").split("Five equal-width keys: history trash, double-zero, zero, decimal, equals.", 1)[1].split("Bottom iOS-style row:", 1)[0].count("KeyButton(") >= 5,
              "trash key": 'Key.Function("clearall", "🗑")' in keypad.read_text(encoding="utf-8"),
              "double zero": 'Key.Symbol("00")' in keypad.read_text(encoding="utf-8") and 'key.label == "00"' in keypad.read_text(encoding="utf-8"),
              "clear tape only": "BasicCalculatorEvent.ClearTape" in keypad.read_text(encoding="utf-8") and "data object ClearTape" in ui_state.read_text(encoding="utf-8") and "BasicCalculatorEvent.ClearTape -> tapeStore.clear()" in vm.read_text(encoding="utf-8"),
              "app name": "格拉瑞计算器" in (app / "src/main/res/values/strings.xml").read_text(encoding="utf-8"),
              "version prefix": 'value = "GLR ' in settings.read_text(encoding="utf-8") and "BuildConfig.VERSION_NAME" in settings.read_text(encoding="utf-8"),
              "license prefix": 'value = "GLR · Apache 2.0"' in settings.read_text(encoding="utf-8"),
              "GitHub URL": "https://github.com/love3crystal/AndroidForge" in settings.read_text(encoding="utf-8"),
              "launcher icon": "GLR" in (app / "src/main/res/drawable/ic_launcher_foreground.xml").read_text(encoding="utf-8") or "pathData=" in (app / "src/main/res/drawable/ic_launcher_foreground.xml").read_text(encoding="utf-8"),
              "APK shrinking": "isMinifyEnabled = true" in gradle.read_text(encoding="utf-8") and "isShrinkResources = true" in gradle.read_text(encoding="utf-8"),
          }
          for name, passed in checks.items():
              print(("PASS" if passed else "FAIL") + " GLR check: " + name)
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit("Refusing to publish APK; GLR checks failed: " + ", ".join(failed))
          PY

      # ---------------------------------------------------------------------
      # Step 3: Detect project (writes detection.json)
      # ---------------------------------------------------------------------
      - name: Detect project type
        id: detect
        run: |
          python3 scripts/detect_project.py \
            --root "${{ steps.extract.outputs.project_root }}" \
            --output detection.json
          echo "::group::Detection JSON"
          cat detection.json
          echo "::endgroup::"

      # ---------------------------------------------------------------------
      # Step 4: Configure toolchain (writes toolchain.json)
      # ---------------------------------------------------------------------
      - name: Configure toolchain
        id: toolchain
        run: |
          python3 scripts/setup_environment.py \
            --root "${{ steps.extract.outputs.project_root }}" \
            --detect detection.json \
            --android-sdk "$ANDROID_HOME" \
            --output toolchain.json
          echo "::group::Toolchain JSON"
          cat toolchain.json
          echo "::endgroup::"

      # ---------------------------------------------------------------------
      # Step 4b: Self-healing system (auto-fixes common project issues)
      # ---------------------------------------------------------------------
      - name: Self-heal project (auto-fix common issues)
        id: self_heal
        run: |
          python3 scripts/self_heal.py \
            --root "${{ steps.extract.outputs.project_root }}" \
            --detect detection.json \
            --toolchain toolchain.json \
            --android-sdk "$ANDROID_HOME" \
            --output self_heal.json
          echo "::group::Self-heal report"
          cat self_heal.json
          echo "::endgroup::"

      # ---------------------------------------------------------------------
      # Step 5: Switch JAVA_HOME to the detected JDK version
      # (No actions/setup-java needed — all JDKs are in the Docker image.)
      # ---------------------------------------------------------------------
      - name: Switch JAVA_HOME to detected version
        run: |
          JDK_VER="${{ steps.toolchain.outputs.jdk_version }}"
          case "$JDK_VER" in
            8)  NEW_JH=/usr/lib/jvm/java-8-openjdk-amd64 ;;
            11) NEW_JH=/usr/lib/jvm/java-11-openjdk-amd64 ;;
            17) NEW_JH=/usr/lib/jvm/java-17-openjdk-amd64 ;;
            21) NEW_JH=/usr/lib/jvm/java-17-openjdk-amd64 ;;  # fallback (no JDK 21 in image yet)
            *)  echo "Unknown JDK version: $JDK_VER — defaulting to JDK 17"
                NEW_JH=/usr/lib/jvm/java-17-openjdk-amd64 ;;
          esac
          echo "Switching JAVA_HOME from $JAVA_HOME → $NEW_JH"
          echo "JAVA_HOME=$NEW_JH" >> "$GITHUB_ENV"
          echo "$NEW_JH/bin" >> "$GITHUB_PATH"
          # Sanity check
          java -version

      # ---------------------------------------------------------------------
      # Step 6: Install MISSING project-specific Android SDK components
      # (Common platforms + build-tools are already in the Docker image —
      # we only install what the project requires that ISN'T already there.)
      # ---------------------------------------------------------------------
      - name: Install missing Android SDK components
        run: |
          # Determine what the project needs from detection.json + toolchain.json
          NEEDS_NDK="${{ steps.toolchain.outputs.needs_ndk }}"
          NDK_VER="${{ steps.toolchain.outputs.ndk_version }}"
          COMPILE_SDK=$(python3 -c "import json; d=json.load(open('detection.json')); v=d.get('versions',{}).get('compile_sdk'); print(v if v else '')")
          echo "Project compileSdk=$COMPILE_SDK"
          # If the project's compileSdk isn't in our image, install it.
          if [ -n "$COMPILE_SDK" ]; then
            if [ ! -d "$ANDROID_HOME/platforms/android-$COMPILE_SDK" ]; then
              echo "Installing missing platform: platforms;android-$COMPILE_SDK"
              yes | sdkmanager "platforms;android-$COMPILE_SDK" || true
            else
              echo "✓ platforms;android-$COMPILE_SDK already present"
            fi
          fi
          # Always make sure platform-tools + a default build-tools are present
          # (the Docker image already has them, but this is a no-op safety check).
          yes | sdkmanager "platform-tools" >/dev/null 2>&1 || true
          # Install NDK if the project uses native code
          if [ "$NEEDS_NDK" = "true" ] || [ "${{ github.event.inputs.enable_ndk }}" = "true" ]; then
            if [ -n "$NDK_VER" ] && [ ! -d "$ANDROID_HOME/ndk/$NDK_VER" ]; then
              echo "Installing NDK: ndk;$NDK_VER"
              yes | sdkmanager "ndk;$NDK_VER" || echo "WARNING: NDK install failed"
            else
              echo "✓ NDK $NDK_VER already present (or not specified)"
            fi
            yes | sdkmanager "cmake;3.22.1" >/dev/null 2>&1 || true
          fi

      # ---------------------------------------------------------------------
      # Step 7: Switch Flutter version if the project needs a different one
      # (Flutter 3.27.0 is already in the Docker image as the default.)
      # ---------------------------------------------------------------------
      - name: Switch Flutter version (if needed)
        if: steps.toolchain.outputs.needs_flutter == 'true'
        run: |
          DETECTED="${{ steps.toolchain.outputs.flutter_version }}"
          CURRENT=$(flutter --version | head -1 | awk '{print $4}')
          echo "Project Flutter version: $DETECTED, image version: $CURRENT"
          if [ "$DETECTED" != "$CURRENT" ] && [ -n "$DETECTED" ]; then
            echo "Project wants Flutter $DETECTED — installing via the Flutter version manager..."
            flutter downgrade "$DETECTED" 2>/dev/null || flutter --version "$DETECTED" 2>/dev/null || true
            flutter --version
          else
            echo "✓ Flutter $CURRENT already satisfies the project"
          fi
          # Make sure desktop + android are enabled
          flutter config --enable-linux-desktop --enable-windows-desktop --enable-macos-desktop || true

      # ---------------------------------------------------------------------
      # Step 8: Restore Gradle cache (per-project, across workflow runs)
      # ---------------------------------------------------------------------
      - name: Restore Gradle cache
        if: steps.toolchain.outputs.needs_gradle == 'true'
        uses: actions/cache@v4
        with:
          path: |
            /root/.gradle/caches
            /root/.gradle/wrapper
            ${{ steps.extract.outputs.project_root }}/.gradle
          key: gradle-${{ steps.toolchain.outputs.gradle_version }}-${{ github.sha }}
          restore-keys: |
            gradle-${{ steps.toolchain.outputs.gradle_version }}-
            gradle-

      # ---------------------------------------------------------------------
      # Step 9: Restore Flutter/Dart cache (for Flutter projects)
      # ---------------------------------------------------------------------
      - name: Restore Flutter pub cache
        if: steps.toolchain.outputs.needs_flutter == 'true'
        uses: actions/cache@v4
        with:
          path: /root/.pub-cache
          key: flutter-pub-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}
          restore-keys: |
            flutter-pub-

      # ---------------------------------------------------------------------
      # Step 10: Verify standalone Gradle (used if wrapper is missing)
      # (Gradle 8.9 is already in the Docker image at /opt/gradle/bin/gradle)
      # ---------------------------------------------------------------------
      - name: Verify standalone Gradle (fallback)
        if: steps.toolchain.outputs.use_wrapper == 'false'
        run: |
          GRADLE_VER="${{ steps.toolchain.outputs.gradle_version }}"
          echo "Image has Gradle 8.9 system-wide at /opt/gradle/bin/gradle"
          which gradle
          gradle --version | head -3
          # The image's system gradle (8.9) is new enough for any AGP 8.x.
          # Only download a DIFFERENT version if the project needs an older
          # one (rare — happens for AGP <= 7.x which requires gradle 7.x).
          # Otherwise, trust the image's gradle and let the build use it.
          if [ -n "$GRADLE_VER" ] && [ "$GRADLE_VER" != "8.9" ] && [ "$GRADLE_VER" != "8.0" ]; then
            # Only download if the requested version is older than 8.9 (e.g. 7.5 for AGP 7.4).
            # For newer Gradle requirements (8.7, 8.10), the image's 8.9 satisfies them.
            REQ_MAJOR=$(echo "$GRADLE_VER" | cut -d. -f1)
            if [ "$REQ_MAJOR" -lt 8 ]; then
              echo "Project wants older Gradle $GRADLE_VER — downloading..."
              wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip" -O /tmp/gradle.zip
              unzip -q /tmp/gradle.zip -d /opt
              echo "/opt/gradle-${GRADLE_VER}/bin" >> "$GITHUB_PATH"
            else
              echo "✓ Image's Gradle 8.9 satisfies the project's requirement of $GRADLE_VER+"
            fi
          fi

      # ---------------------------------------------------------------------
      - name: Upgrade Gradle for Flutter
        if: steps.toolchain.outputs.needs_flutter == 'true'
        run: |
          GRADLE_DIR=/opt/gradle-8.14.3
          if [ ! -x "$GRADLE_DIR/bin/gradle" ]; then
            wget -q https://services.gradle.org/distributions/gradle-8.14.3-bin.zip -O /tmp/gradle-8.14.3-bin.zip
            unzip -q /tmp/gradle-8.14.3-bin.zip -d /opt
          fi
          echo "$GRADLE_DIR/bin" >> "$GITHUB_PATH"
          PROJECT_ROOT="${{ steps.extract.outputs.project_root }}"
          WRAPPER="$PROJECT_ROOT/android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER" ]; then
            sed -i -E 's/gradle-[0-9.]+-(bin|all)\.zip/gradle-8.14.3-\1.zip/' "$WRAPPER"
          fi
          "$GRADLE_DIR/bin/gradle" --version
      # Step 11: Build the project (writes build.json)
      # ---------------------------------------------------------------------
      - name: Build project
        id: build
        continue-on-error: true
        run: |
          ROOT="${{ steps.extract.outputs.project_root }}"
          echo "=== Remove pre-existing build outputs to prevent publishing a stale APK ==="
          # The uploaded source ZIP can contain old app/build outputs. Remove all
          # generated Gradle build directories so only this run's patched source
          # can produce the APK that is collected and published.
          find "$ROOT" -type d -name build -prune -exec rm -rf {} +
          rm -rf "$GITHUB_WORKSPACE/output"
          mkdir -p "$GITHUB_WORKSPACE/output"
          python3 "$GITHUB_WORKSPACE/scripts/build_project.py" \
            --root "$ROOT" \
            --detect "$GITHUB_WORKSPACE/detection.json" \
            --toolchain "$GITHUB_WORKSPACE/toolchain.json" \
            --variant "${{ inputs.build_variant || 'release' }}" \
            --log-dir "$GITHUB_WORKSPACE/.androidforge/logs" \
            --output "$GITHUB_WORKSPACE/build.json" || true
          # Always emit a minimal build.json if the script didn't write one
          if [ ! -f "$GITHUB_WORKSPACE/build.json" ]; then
            echo '{"build_succeeded": false, "successful_command": null, "exit_code": -1, "log_file": null}' > "$GITHUB_WORKSPACE/build.json"
          fi
          cat "$GITHUB_WORKSPACE/build.json"

      # ---------------------------------------------------------------------
      # Step 12: Collect APKs (writes collect.json; runs even on build failure)
      # ---------------------------------------------------------------------
      - name: Collect APKs
        id: collect
        if: always()
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/collect_apk.py" \
            --root "${{ steps.extract.outputs.project_root }}" \
            --variant "${{ inputs.build_variant || 'auto' }}" \
            --output-dir "$GITHUB_WORKSPACE/output" \
            --output-json "$GITHUB_WORKSPACE/collect.json" || true
          if [ ! -f "$GITHUB_WORKSPACE/collect.json" ]; then
            echo '{"apk_count": 0, "primary": null, "all_apks": []}' > "$GITHUB_WORKSPACE/collect.json"
          fi
          cat "$GITHUB_WORKSPACE/collect.json"

      # ---------------------------------------------------------------------
      - name: Set up Android signing tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Sign and verify APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"

          sdkmanager --install "build-tools;35.0.0"

          KEYSTORE="$RUNNER_TEMP/calculator-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"

          found=0
          while IFS= read -r -d '' apk; do
            found=1
            signed="${apk%.apk}-signed.apk"

            "$APKSIGNER" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias calculator \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --out "$signed" \
              "$apk"

            "$APKSIGNER" verify --verbose "$signed"
            mv "$signed" "$apk"
          done < <(find "$GITHUB_WORKSPACE/output" -type f -name '*.apk' -print0)

          if [ "$found" -ne 1 ]; then
            echo "ERROR: No APK files found in output directory."
            exit 1
          fi

          # Never publish the exact known-bad APK again.
          OLD_APK_SHA256="31a0afd581a2e4e3799f7c6f0d97dcd621143aebef7216f75451f0b43a93d940"
          while IFS= read -r -d '' apk; do
            sha="$(sha256sum "$apk" | awk '{print $1}')"
            echo "Verified candidate APK: $(basename "$apk") sha256=$sha"
            if [ "$sha" = "$OLD_APK_SHA256" ]; then
              echo "::error::Refusing to publish the known unchanged APK."
              exit 1
            fi
          done < <(find "$GITHUB_WORKSPACE/output" -type f -name '*.apk' -print0)

          # Verify the compiled DEX changed, not just the app version string.
          # Baseline is the previously delivered bad APK, normalized for DEX header checksum/signature
          # and the version label. A matching normalized hash means the UI code is still unchanged.
          python3 - "$GITHUB_WORKSPACE/output" <<'PY'
          import hashlib, pathlib, re, sys, zipfile
          output = pathlib.Path(sys.argv[1])
          baseline = "135f99986846a337b15ef8eda98f52f8c3aaf67b71714e378f51b57e58ed0e31"
          apks = list(output.glob("*.apk"))
          if not apks:
              raise SystemExit("No APK found for compiled-code verification.")
          for apk in apks:
              with zipfile.ZipFile(apk) as z:
                  dex = bytearray(z.read("classes.dex"))
              if len(dex) < 32:
                  raise SystemExit(f"{apk.name}: classes.dex is unexpectedly short.")
              dex[8:32] = b"\0" * 24
              normalized, count = re.subn(rb"\d+\.\d+\.\d+ \(\d{5}\)", b"0.0.0 (00000)", bytes(dex))
              if count != 1:
                  raise SystemExit(f"{apk.name}: expected one version label in DEX, found {count}.")
              digest = hashlib.sha256(normalized).hexdigest()
              print(f"Compiled DEX normalized SHA-256: {apk.name} {digest}")
              if digest == baseline:
                  raise SystemExit(f"{apk.name}: compiled code is unchanged apart from version metadata; refusing to publish.")
          PY

          rm -f "$KEYSTORE"
      # ---------------------------------------------------------------------
      # Step 13: Upload APK artifact
      # ---------------------------------------------------------------------
      - name: Upload APK artifact
        if: steps.collect.outputs.apk_count != '0' && steps.collect.outputs.apk_count != ''
        uses: actions/upload-artifact@v4
        with:
          name: AndroidForge-APKs
          path: ${{ steps.collect.outputs.apk_directory }}/*.apk
          if-no-files-found: ignore
          retention-days: 30
          compression-level: 0

      - name: Upload AAB artifact (if any)
        if: steps.collect.outputs.apk_count != '0' && steps.collect.outputs.apk_count != ''
        uses: actions/upload-artifact@v4
        with:
          name: AndroidForge-AAB
          path: ${{ steps.collect.outputs.apk_directory }}/*.aab
          if-no-files-found: ignore
          retention-days: 30

      # ---------------------------------------------------------------------
      # Step 14: ALWAYS publish APKs to a fresh output release (tag derived
      # from the run id, so the Pages UI can fetch it predictably). This
      # step runs server-side on the GitHub runner — no CORS issues, no
      # browser uploads. The UI then fetches the release's asset list via
      # api.github.com (CORS-enabled) and offers direct download links to
      # the regular GitHub navigation URLs.
      #
      # We use the GitHub REST API directly via curl (no `gh` dependency)
      # because the Docker image doesn't ship `gh` and installing it via
      # apt requires a GPG key that sometimes fails to import.
      # ---------------------------------------------------------------------
      - name: Publish APKs to output release
        if: always() && steps.collect.outputs.apk_count != '0' && steps.collect.outputs.apk_count != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="web-build-output-${{ github.run_id }}"
          REPO_API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          AUTH_HEADER="Authorization: Bearer $GH_TOKEN"
          API_VERSION="X-GitHub-Api-Version: 2022-11-28"
          ACCEPT="Accept: application/vnd.github+json"

          echo "=== Step 1: Create release with tag $TAG ==="
          # Try to create the release; if it already exists (race with
          # a previous attempt), we just look it up.
          RELEASE_RESPONSE=$(curl -sS -X POST \
            -H "$AUTH_HEADER" -H "$ACCEPT" -H "$API_VERSION" -H "Content-Type: application/json" \
            "$REPO_API/releases" \
            -d "{\"tag_name\":\"$TAG\",\"target_commitish\":\"main\",\"name\":\"Build #${{ github.run_number }} output\",\"body\":\"Auto-generated by AndroidForge workflow run ${{ github.run_id }}.\",\"prerelease\":true}")
          RELEASE_ID=$(echo "$RELEASE_RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null)

          if [ -z "$RELEASE_ID" ]; then
            echo "Create-release call didn't return an id — release likely already exists. Looking it up..."
            RELEASE_ID=$(curl -sS -H "$AUTH_HEADER" -H "$ACCEPT" -H "$API_VERSION" \
              "$REPO_API/releases/tags/$TAG" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null)
          fi

          if [ -z "$RELEASE_ID" ]; then
            echo "::error::Could not create or find release with tag $TAG"
            echo "Create-release response: $RELEASE_RESPONSE"
            exit 1
          fi
          echo "  ✓ Release ID: $RELEASE_ID (tag: $TAG)"

          echo "=== Step 2: Upload APKs/AABs to the release ==="
          cd "$GITHUB_WORKSPACE/output"
          shopt -s nullglob
          UPLOADED=0
          for f in *.apk *.aab; do
            [ -e "$f" ] || continue
            echo "  → Uploading $f ($(stat -c%s "$f" | awk '{printf "%.1f MB", $1/1024/1024}'))..."
            # Upload via uploads.github.com (different host than api.github.com)
            UPLOAD_URL="https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$(basename "$f")"
            HTTP_CODE=$(curl -sS -X POST \
              -H "$AUTH_HEADER" -H "$ACCEPT" -H "$API_VERSION" -H "Content-Type: application/zip" \
              --data-binary "@$f" \
              -o /tmp/upload-response.json -w "%{http_code}" \
              "$UPLOAD_URL")
            if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ]; then
              echo "    ✓ uploaded (HTTP $HTTP_CODE)"
              UPLOADED=$((UPLOADED+1))
            else
              echo "    ✗ failed (HTTP $HTTP_CODE)"
              cat /tmp/upload-response.json | head -3
            fi
          done

          echo "=== Step 3: Surface release tag to UI + summary ==="
          echo "output_release_tag=$TAG" >> "$GITHUB_ENV"
          echo "output_release_tag=$TAG" >> "$GITHUB_OUTPUT"
          {
            echo "## 📦 Output release"
            echo ""
            echo "Tag: \`$TAG\`"
            echo "URL: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
            echo ""
            echo "Assets uploaded: $UPLOADED"
            echo ""
            # List the assets via the API for the summary
            curl -sS -H "$AUTH_HEADER" -H "$ACCEPT" -H "$API_VERSION" \
              "$REPO_API/releases/$RELEASE_ID" \
              | python3 -c "
          import json,sys
          d = json.load(sys.stdin)
          print('Assets in release:')
          for a in d.get('assets', []):
              print(f\"  - {a['name']} ({a['size']} bytes)\")
              print(f\"    download: {a['browser_download_url']}\")
          " || echo "(could not list assets)"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Done. Release $TAG contains $UPLOADED asset(s)."

      # ---------------------------------------------------------------------
      # Step 15: Upload build logs (always, for debugging)
      # ---------------------------------------------------------------------
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidForge-logs
          path: |
            .androidforge/logs/
            ${{ steps.extract.outputs.project_root }}/build/outputs/
            ${{ steps.extract.outputs.project_root }}/**/build/reports/
            ${{ steps.extract.outputs.project_root }}/**/build/outputs/
          if-no-files-found: ignore
          retention-days: 14

      # ---------------------------------------------------------------------
      # Step 16: Diagnose failure (only on build failure)
      # ---------------------------------------------------------------------
      - name: Diagnose failure
        if: steps.build.outputs.build_succeeded != 'true'
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/diagnose_failure.py" \
            --root "${{ steps.extract.outputs.project_root }}" \
            --log-dir "$GITHUB_WORKSPACE/.androidforge/logs" || true

      # ---------------------------------------------------------------------
      # Step 17: Build summary (always)
      # ---------------------------------------------------------------------
      - name: Build summary
        if: always()
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/build_summary.py" \
            --detect "$GITHUB_WORKSPACE/detection.json" \
            --toolchain "$GITHUB_WORKSPACE/toolchain.json" \
            --build "$GITHUB_WORKSPACE/build.json" \
            --collect "$GITHUB_WORKSPACE/collect.json" || true
          # Also dump the self-heal report into the workflow summary if it exists
          if [ -f "$GITHUB_WORKSPACE/self_heal.json" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## 🩹 Self-heal report" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$GITHUB_WORKSPACE/self_heal.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      # ---------------------------------------------------------------------
      # Final: fail the job if the build itself failed
      # ---------------------------------------------------------------------
      - name: Fail if build failed
        if: steps.build.outputs.build_succeeded != 'true'
        run: |
          echo "::error::Android build failed. See the diagnosis above and the AndroidForge-logs artifact."
          exit 1
